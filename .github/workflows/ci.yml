name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # proto/generated has no Go packages yet; add it here once it does.
        module: [shared, services/accounts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -cover ./...

  docker-build:
    name: docker build (accounts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the image to verify the Dockerfile works. It does not push;
      # publishing needs a registry and credentials, added in a later step.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/accounts/dockerfile
          push: false
          build-args: |
            SERVICE_NAME=accounts
            SERVICE_PATH=services/accounts
            BUILD_VERSION=${{ github.sha }}
