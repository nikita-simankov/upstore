name: upstore-infrastructure

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: upstore-postgres

    environment:
      POSTGRES_DB: upstore
      POSTGRES_USER: upstore_owner
      POSTGRES_PASSWORD: upstore_owner_pass
      POSTGRES_INITDB_ARGS: "--data-checksums"

    ports:
      - "127.0.0.1:5432:5432"

    networks:
      - upstore

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upstore_owner -d upstore"]
      retries: 10
      timeout: 3s
      interval: 5s
      start_period: 5s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    container_name: upstore-valkey

    ports:
      - "127.0.0.1:6379:6379"

    networks:
      - upstore

    volumes:
      - valkey_data:/data

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    container_name: upstore-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: upstore
      RABBITMQ_DEFAULT_PASS: dev_only_password
      RABBITMQ_DEFAULT_VHOST: /

    ports:
      - "127.0.0.1:5672:5672" # AMQP
      - "127.0.0.1:15672:15672" # UI

    networks:
      - upstore

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    container_name: upstore-grafana

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: dev_only_password
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - upstore

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    container_name: upstore-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - upstore

    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus

volumes:
  valkey_data:
  grafana_data:
  postgres_data:
  rabbitmq_data:
  prometheus_data:

networks:
  upstore:
    name: upstore
    external: true
